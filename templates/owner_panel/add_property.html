<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 750px;">
        <div class="card-body p-4">

            <h2 class="mb-4">Add Property</h2>

            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <label class="form-label">Property Category</label>
                <select name="category" class="form-select mb-3" required>
                    <option value="">Select category</option>
                    <option value="Room">Room</option>
                    <option value="PG">PG</option>
                    <option value="1 BHK">1 BHK</option>
                </select>

                <label class="form-label">Property Title</label>
                <input type="text" name="title"
                       class="form-control mb-3"
                       placeholder="e.g. Spacious Room near Rankala"
                       required>

                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control mb-3"
                          rows="4" required></textarea>

                <label class="form-label">Area in Kolhapur</label>
                <input type="text" name="area"
                       class="form-control mb-3"
                       placeholder="e.g. Rajarampuri, Kolhapur"
                       required>

                <label for="rent">Monthly Rent (₹)</label>
                <input
                    type="number"
                    id="rent"
                    name="rent"
                    min="0"
                    step="0.01"
                    placeholder="Enter monthly rent"
                    required
                >

                <label class="form-label">Property Image</label>
                <input type="file" name="image"
                       class="form-control mb-4"
                       accept="image/*">

                <button type="submit" class="btn btn-primary">
                    Add Property
                </button>

                <a href="{% url 'owner_dashboard' %}"
                   class="btn btn-secondary">
                    Back to Dashboard
                </a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
