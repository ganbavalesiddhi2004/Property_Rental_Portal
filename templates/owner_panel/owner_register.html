<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Owner Registration | Property Rental Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 450px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .brand {
            text-align: center;
            color: #2563eb;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            height: 47px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .btn-register {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="register-card">

    <div class="brand">

        <i class="fa-solid fa-house"></i>
        Property Rental Portal

    </div>

    <div class="subtitle">

        Create your Owner Account

    </div>


    {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <!-- Full Name -->

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   name="full_name"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>

        </div>


        <!-- Email -->

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>

        </div>


        <!-- Phone -->

        <div class="mb-3">

            <label class="form-label">
                Phone Number
            </label>

            <input type="tel"
                   name="phone"
                   class="form-control"
                   placeholder="Enter your phone number"
                   maxlength="10"
                   required>

        </div>


        <!-- Password -->

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Create a password"
                   required>

        </div>


        <!-- Confirm Password -->

        <div class="mb-3">

            <label class="form-label">
                Confirm Password
            </label>

            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm your password"
                   required>

        </div>


        <button type="submit"
                class="btn-register">

            <i class="fa-solid fa-user-plus"></i>

            Create Owner Account

        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'owner_login' %}">
            Login here
        </a>

    </div>

</div>

</body>

</html>
