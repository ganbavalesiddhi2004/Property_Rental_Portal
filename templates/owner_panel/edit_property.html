
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Property</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
        }

        .edit-card {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .edit-card h3 {
            font-weight: 700;
            margin-bottom: 25px;
        }

        .edit-card .form-label {
            font-size: 13px;
            font-weight: 600;
        }

        .edit-card .form-control,
        .edit-card .form-select {
            padding: 12px 14px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .edit-card .form-control:focus,
        .edit-card .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
        }

        .edit-card .btn {
            padding: 10px 18px;
            border-radius: 9px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="edit-card bg-white">

        <h3>Edit Property</h3>

        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label class="form-label">Property Category</label>
            <select name="category" class="form-select" required>
                <option value="Room"
                    {% if property.category == "Room" %}selected{% endif %}>
                    Room
                </option>
                <option value="PG"
                    {% if property.category == "PG" %}selected{% endif %}>
                    PG
                </option>
                <option value="1 BHK"
                    {% if property.category == "1 BHK" %}selected{% endif %}>
                    1 BHK
                </option>
            </select>

            <label class="form-label">Property Title</label>
            <input type="text" name="title" class="form-control"
                   value="{{ property.title }}" required>

            <label class="form-label">Description</label>
            <textarea name="description" class="form-control"
                      rows="4" required>{{ property.description }}</textarea>

            <label class="form-label">Area in Kolhapur</label>
            <input type="text" name="area" class="form-control"
                   value="{{ property.area }}" required>

            <label class="form-label">Monthly Rent (₹)</label>
            <input type="number" name="rent" class="form-control"
                   min="0" step="0.01" value="{{ property.rent }}" required>

            <label class="form-label">Replace Property Image (optional)</label>

            {% if property.image %}
                <div class="mb-3">
                    <img src="{{ property.image.url }}"
                         alt="Current property image"
                         style="width:150px;height:100px;object-fit:cover;border-radius:8px;">
                </div>
            {% endif %}

            <input type="file" name="image"
                   class="form-control" accept="image/*">

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'owner_dashboard' %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

</body>
</html>
