<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Owner Login | Property Rental Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 400px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .brand {
            text-align: center;
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 8px 0 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="brand">

        <i class="fa-solid fa-house"></i>
        Property Rental Portal

    </div>

    <p class="subtitle">

        Owner Login

    </p>


    {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>

        </div>


        <button type="submit"
                class="btn-login">

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>


    <div class="register-link">

        Don't have an owner account?

        <a href="{% url 'owner_register' %}">
            Register Now
        </a>

    </div>

</div>

</body>

</html>
