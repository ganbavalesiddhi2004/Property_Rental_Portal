
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login | Property Rental Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        /* General Page Styling */
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #111827;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px !important;
        }

        /* Login Card */
        .card {
            width: 100%;
            max-width: 450px !important;
            padding: 38px 35px !important;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.20) !important;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.25) !important;
        }

        /* Main Heading */
        h2 {
            color: #2864f0;
            font-size: 29px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 7px;
        }

        /* Subheading */
        .text-muted {
            color: #111827 !important;
            font-size: 23px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 35px;
        }

        /* Form Labels */
        .form-label {
            display: block;
            color: #111827;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Input Fields */
        .form-control {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 1px solid #d7deea;
            border-radius: 11px;
            background: #ffffff;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            box-shadow: none;
            transition: border-color 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .form-control::placeholder {
            color: #8993a4;
        }

        .form-control:focus {
            border-color: #2864f0;
            box-shadow: 0 0 0 3px rgba(40, 100, 240, 0.13);
            outline: none;
        }

        .mb-3 {
            margin-bottom: 20px !important;
        }

        /* Login Button */
        .btn-primary {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: none;
            border-radius: 11px;
            background: #2864f0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.25s ease,
                        transform 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(40, 100, 240, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Registration Text */
        p.text-center.mt-3 {
            color: #374151;
            font-size: 13px;
            margin-top: 23px !important;
            margin-bottom: 0;
        }

        /* Links */
        a {
            color: #2864f0;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #173b9b;
            text-decoration: underline;
        }

        a.text-center {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Django Messages */
        .alert {
            border: none;
            border-radius: 9px;
            padding: 12px 14px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .alert-info {
            color: #173b65;
            background: #eaf2ff;
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .container {
                padding: 20px 15px !important;
            }

            .card {
                padding: 30px 22px !important;
                border-radius: 17px;
            }

            h2 {
                font-size: 25px;
            }

            .text-muted {
                font-size: 21px;
                margin-bottom: 28px;
            }

            .form-control {
                min-height: 45px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card shadow">

        <h2>Property Rental Portal</h2>
        <p class="text-muted">User Login</p>

        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="category" value="{{ category }}">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                &#10148; Login
            </button>
        </form>

        <p class="text-center mt-3">
            Don't have a user account?
            <a href="{% url 'user_register' %}">Register Now</a>
        </p>

        <a href="{% url 'home' %}" class="text-center">
            Back to Home
        </a>

    </div>
</div>

</body>
</html>
