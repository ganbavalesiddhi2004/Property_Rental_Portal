
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    
<style>
    /* Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    /* General Page Styling */
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #eaf2ff, #f5f7fb);
        min-height: 100vh;
        margin: 0;
        color: #243247;
    }

    /* Main Container */
    .container {
        padding-top: 45px !important;
        padding-bottom: 45px !important;
    }

    /* Registration Card */
    .card {
        max-width: 500px !important;
        width: 100%;
        border: none;
        border-radius: 18px;
        background: #ffffff;
        padding: 35px !important;
        box-shadow: 0 12px 35px rgba(25, 55, 100, 0.12) !important;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 16px 40px rgba(25, 55, 100, 0.17) !important;
    }

    /* Heading */
    h2 {
        color: #173b65;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .text-muted {
        color: #7b8798 !important;
        font-size: 13px;
        margin-bottom: 28px;
    }

    /* Form Labels */
    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #34445b;
        margin-bottom: 8px;
    }

    /* Input Fields */
    .form-control {
        min-height: 46px;
        border: 1px solid #dce3ed;
        border-radius: 9px;
        padding: 11px 14px;
        font-family: inherit;
        font-size: 13px;
        color: #243247;
        background-color: #fbfcff;
        transition: border-color 0.25s ease,
                    box-shadow 0.25s ease,
                    background-color 0.25s ease;
    }

    .form-control:focus {
        border-color: #2864a5;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(40, 100, 165, 0.12);
        outline: none;
    }

    .form-control::placeholder {
        color: #a4adba;
    }

    /* Form Spacing */
    .mb-3 {
        margin-bottom: 18px !important;
    }

    /* Register Button */
    .btn-primary {
        min-height: 47px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #173b65, #2864a5);
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;
        margin-top: 5px;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #102d4f, #1c508b);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(23, 59, 101, 0.2);
    }

    .btn-primary:active {
        transform: translateY(0);
    }

    /* Login Link */
    p.text-center.mt-3 {
        font-size: 13px;
        color: #66758a;
        margin-top: 22px !important;
        margin-bottom: 16px;
    }

    a {
        color: #2463a2;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    a:hover {
        color: #123d6c;
        text-decoration: underline;
    }

    /* Back to Home Link */
    a.text-center {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-top: 15px;
    }

    /* Django Messages */
    .alert {
        border: none;
        border-radius: 8px;
        font-size: 13px;
        padding: 12px 14px;
        overflow-wrap: anywhere;
    }

    .alert-info {
        background-color: #eaf3ff;
        color: #194b7e;
    }

    /* Mobile Responsive Design */
    @media (max-width: 576px) {
        .container {
            padding: 20px 15px !important;
        }

        .card {
            padding: 25px 20px !important;
            border-radius: 14px;
        }

        h2 {
            font-size: 24px;
        }

        .form-control {
            min-height: 44px;
        }
    }
</style>

</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center">Create Account</h2>
        <p class="text-center text-muted">Register to explore properties</p>

        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="category" value="{{ category }}">

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="{% url 'user_login' %}">Login</a>
        </p>

        <a href="{% url 'home' %}" class="text-center">Back to Home</a>
    </div>
</div>

</body>
</html>
