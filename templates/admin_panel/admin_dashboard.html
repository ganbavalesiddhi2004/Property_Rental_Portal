<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0f172a;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .dashboard-title {
            font-weight: bold;
            color: #0f172a;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        .stat-title {
            color: #64748b;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <span class="navbar-brand">
            Admin Panel
        </span>

        <a href="{% url 'admin_logout' %}"
           class="btn btn-danger">
            Logout
        </a>

    </div>

</nav>


<div class="container py-5">

    <h2 class="dashboard-title mb-4">
        Welcome, Admin 👋
    </h2>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Total Users
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Total Owners
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Properties
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Bookings
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Reviews
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    Reports
                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
