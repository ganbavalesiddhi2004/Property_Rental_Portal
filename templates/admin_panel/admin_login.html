<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 400px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .login-title {
            text-align: center;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
        }
        .login-subtitle strong {
    display: block;
    font-size: 22px;
    color: #2563eb;
    font-weight: 700;
    margin-top: 4px;
}

        .login-subtitle {
    text-align: center;
    color: #64748b;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
}
.login-subtitle span {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
    letter-spacing: 0.3px;
}
        .form-control {
            height: 48px;
            border-radius: 10px;
        }
          .form-label {
            font-weight: 600;
        }
        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="login-card">

   <!-- <p class="login-subtitle">
    <i class="fa-solid fa-house"></i>
   Property Rental Portal
    <span>Find your perfect place </span>
   </p>

    <h3 class="login-title">Admin Login</h3> -->

    <div class="brand">

        <i class="fa-solid fa-house"></i>
        Property Rental Portal

    </div>

     <center><h3 class="login-title">Admin Login</h3></center>
    <br>
    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
